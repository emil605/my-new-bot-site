<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top">
    <button class="close">Закрыть</button>

    <div class="title">
        <b>Предложка Новости и Факт...</b>
        <span>мини-приложение</span>
    </div>

    <button class="more">•••</button>
</header>


<main>

    <!-- БАННЕР -->
    <section class="banner">
        <div class="banner-text">
            <h1>NFT 👑</h1>
            <p>Коллекционируй<br>и зарабатывай!</p>
        </div>

        <div class="cat">🐱</div>
    </section>


    <!-- БАЛАНС -->
    <section class="balance">
        <div class="coins">
            ⭐ <b>0</b>
        </div>

        <button class="add">
            ＋ &nbsp; Пополнить
        </button>
    </section>


    <!-- КАТЕГОРИИ -->
    <div class="categories">

        <button class="category active">
            <span>♛</span>
            <b>LIVE</b>
        </button>

        <button class="category">
            <span>🎁</span>
            <b>Бесплатно</b>
        </button>

        <button class="category">
            <span>💼</span>
            <b>Кейсы</b>
        </button>

        <button class="category">
            <span>⬆️</span>
            <b>Апгрейд</b>
        </button>

        <button class="category">
            <span>🚀</span>
            <b>Краш</b>
        </button>

    </div>


    <!-- КАРТОЧКИ -->
    <div class="items">

        <div class="item free">
            <div class="item-icon">🎁</div>

            <div class="item-info">
                <h2>Бесплатно</h2>
                <p><span>0</span> кейсов</p>
            </div>

            <div class="arrow">›</div>
        </div>


        <div class="item cases">
            <div class="item-icon">💼</div>

            <div class="item-info">
                <h2>Кейсы</h2>
                <p><span>0</span> кейсов</p>
            </div>

            <div class="arrow">›</div>
        </div>


        <div class="item upgrade">
            <div class="item-icon">⬆️</div>

            <div class="item-info">
                <h2>Апгрейд</h2>
                <p><span>0</span> улучшений</p>
            </div>

            <div class="arrow">›</div>
        </div>


        <div class="item crash">
            <div class="item-icon">🚀</div>

            <div class="item-info">
                <h2>Краш</h2>
                <p><span>0</span> игр</p>
            </div>

            <div class="arrow">›</div>
        </div>


        <div class="item mines">
            <div class="item-icon">🐱</div>

            <div class="item-info">
                <h2>Мины</h2>
                <p><span>0</span> игр</p>
            </div>

            <div class="arrow">›</div>
        </div>


        <div class="item plinko">
            <div class="item-icon">🎱</div>

            <div class="item-info">
                <h2>Plinko</h2>
                <p><span>0</span> игр</p>
            </div>

            <div class="arrow">›</div>
        </div>

    </div>

</main>


<!-- НИЖНЕЕ МЕНЮ -->
<nav class="bottom">

    <button class="nav-item selected">
        <span>🎮</span>
        <small>Игры</small>
    </button>

    <button class="nav-item">
        <span>🏆</span>
        <small>Конкурсы</small>
    </button>

    <button class="nav-item tasks">
        <span>💼</span>
        <i>0</i>
        <small>Задания</small>
    </button>

    <button class="nav-item">
        <span>🔄</span>
        <small>Турнир</small>
    </button>

    <button class="nav-item">
        <span>♙</span>
        <small>Профиль</small>
    </button>

</nav>


<script>
    const categories = document.querySelectorAll(".category");

    categories.forEach(button => {
        button.addEventListener("click", () => {

            categories.forEach(item => {
                item.classList.remove("active");
            });

            button.classList.add("active");
        });
    });
</script>

</body>
</html>
